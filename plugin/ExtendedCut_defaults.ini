; PunisherPad v0.20.2 - controller mapping for The Punisher (PC)
; Default layout follows the original Xbox version of the game, using your PC key bindings.
; Button names use the Xbox layout: A = Cross, B = Circle, X = Square, Y = Triangle on PlayStation.
; Values: a key (W, E, SPACE, TAB, ESCAPE, PAUSE, F1, 1, UP ...), MOUSE1, MOUSE2, MOUSE3, WHEELUP, WHEELDOWN, NONE.

[Buttons]
LeftStickUp=W          ; move forward
LeftStickDown=S        ; move reverse
LeftStickLeft=A        ; step left
LeftStickRight=D       ; step right
RT=MOUSE1              ; fire
LT=MOUSE2              ; alt fire / offhand throw / throw held
A=E                    ; grab / use / interrogate
X=Q                    ; quick kill
B=G                    ; pickup weapon / melee item (PS2 Circle)
Y=TAB                  ; slaughter mode (knock out shield)
L3=C                   ; crouch
R3=F                   ; fine aim (zoom)
RB=SPACE               ; jump / dodge (PS2 R1)
LB=C                   ; crouch (PS2 L1; L3 also crouches)
Back=ESCAPE            ; in-game menu
Start=PAUSE            ; plain pause screen (console style)
DpadUp=1               ; use pistol
DpadDown=2             ; use rifle
DpadLeft=H             ; holster
DpadRight=T            ; next weapon

[Settings]
LevelPoolMB=128           ; level memory in MB (0 = retail 32.5; 128 = default since v0.80: room for smooth blacks / HD textures). Restart
PermanentPoolMB=0         ; v0.58: always-loaded memory in MB (0 = retail 9.1; 32 for HUD / weapon HD packs). Restart
RetailBugFixes=1          ; v0.59: fixes bugs in the original game (Colliding_mesh pool check). 0 = off. Restart
BoneMatrices=3200         ; v0.59: animated bones per frame (retail 800 = bodies can freeze when many are on screen). Restart
LookSensitivityX=900   ; camera speed left/right at full stick
LookSensitivityY=600   ; camera speed up/down at full stick
LookCurve=2.0          ; 1 = linear, higher = finer aiming near the centre
GunInterrogationCamera=1   ; v0.54: gun tension camera 0 = retail, 1 = over-the-shoulder + front (random), 2 = Oct 2004 original + front, 3 = Oct 2004 only
LookDeadzone=0.15
MoveDeadzone=0.35
TriggerThreshold=0.35
SwapTriggersWhenDualWielding=1 ; dual-wielding: RT = right-hand gun, LT = left-hand gun (like console)
InvertY=0
InterrogationBoost=6.0 ; stick strength in the 4 standard interrogations (choke, gun, punch, face)
EnvInterrogationBoost=12.0 ; stick strength in environment interrogations (wood chipper, blowtorch ...)
InterrogationCurve=1.0 ; 1 = linear: a gentle tilt gives a gentle push (slow push), full tilt = sudden push
InterrogationNativeStick=0 ; 0 = interrogations use the mouse path (the console reader did not respond on PC)
LogInterrogation=1     ; log trackpad/mouse and stick force during interrogations (for tuning)
KeyMethod=1            ; 1 = send real key presses to the game window, 0 = old v0.2 method
LogKeys=0              ; 1 = log the first 300 button presses, 2 = log all, 0 = off
DecalDiagnostics=0     ; log the quick-kill decal code (1 = on)
NativeLeftStick=1      ; v0.7: left stick goes to the game's own console stick reader (real analog)
LeftStickKeys=0        ; 0 = analog walking; W/A/S/D are sent automatically on the interrogation choice screen
NativeRightStick=0     ; 1 = right stick also to the console reader (test; camera may double up)
NativeDeadzone=0.15
InvertNativeY=0        ; v0.7.1 fixed the direction - keep 0 (set 1 only if forward/back are reversed again)
DecalLayers=1          ; quick-kill blood decals painted N times on top of each other: 1 = normal, 2-4 = bloodier
AnimPoolKB=4096        ; memory for the always-loaded animations (perm_mot.vpp). Retail 1816. Bigger = room for restored animations
HelpKey=J              ; v0.11: the game's Help action moves from F1 to this key (F1 = back to normal, NONE = leave it)

[Menu]
; used only while a menu is open (D-pad / left stick move through menus)
A=ENTER                ; select
B=ESCAPE               ; back

[Interrogation]
; used only while you interrogate (before the enemy breaks); once he breaks and you hold him as a shield, [Hostage] applies
Y=J                    ; help (console Triangle / Y) - must match HelpKey above

[Hostage]
; used only while holding a hostage (human shield), like the PS2
Y=N                    ; knock out / toss shield through a door (PS2 Triangle)
LB=R                   ; reload (PS2 L1)

[Prompts]
; v0.10 button prompts (hint text icons + stick picture on the interrogation choice)
Style=SteamDeck        ; SteamDeck (needs the Steam Deck misc.vpp from v0.10), Xbox, PlayStation, Keyboard,
                       ; or Auto = PlayStation icons for PlayStation pads, Xbox icons for everything else
StickPicture=1         ; interrogation choice: stick picture instead of the W/A/S/D letters (with a controller)
LogPrompts=1           ; log each different prompt once and which button it picked (0 = off)

[Rumble]
; v0.14 rumble (the PC port removed the console force feedback - this rebuilds it)
Enabled=1              ; 0 = no rumble at all
Strength=1.0           ; 0.0 - 2.0, scales every rumble (try 0.6 if it is too strong)
Weapons=1              ; your own shots, per weapon, using the console effect names (Pistol, Shotgun, Auto ...)
Explosions=1           ; whenever the game shakes the camera (explosions, rockets ...)
Melee=1                ; quick kills, interrogations (incl. heartbeat), punches, kicks, environment and prop kills
Hits=1                 ; when the Punisher gets hurt (stronger for bigger hits)
HitMinimum=1.0         ; smallest health loss (of 430) that rumbles - lower it to feel every graze
QuickKillFPS=30        ; quick kill timing (normal, prop and environment kills): raise it if the hit rumble comes too late, lower if too early
Log=0                  ; log the first 100 rumbles (0 = off)

[Enhancements]
DeveloperMode=1          ; v0.56: 1 = show the Cheats & Debug tab in the Extended menu (v1.38: on by default)
; v0.20 in-game enhancements menu: pause with Start, then press OpenButton. Changes work at once and are
; saved into this file when you close the menu (old file kept as PunisherPad.ini.bak). X in the menu = back to
; PunisherPad_defaults.ini (made once from this file on first start; delete it to take new defaults).
OpenButton=Y           ; button that opens the menu on the pause screen (Xbox names: A, B, X, Y, LB, RB, Back ...)
PauseHint=1            ; show "Y  PunisherPad enhancements" at the bottom of the pause screen (0 = hide)
MenuX=0.15             ; menu position: fraction of the screen width ...
MenuY=0.14             ; ... and height
ValueColumn=0          ; 0 = values start after the longest name on the page
CharWidth=0.8          ; character width / font height, used for spacing (raise it if names overlap)
Font=Interface         ; Interface, Title, Hud or Current
Layout=1               ; pause + Y: 1 = the dark menu (default), 0 = the paper look. From the in-game menu -> Options it is always the paper (v1.39)

[Beta]
AlwaysFlashbacks=0       ; v0.58: 1 = already unlocked flashbacks play again (interrogation of a thug from their gang, once per level)
; Restored cut content (needs the Extended Cut perm_mot.vpp). Read at game start: restart after a change.
Dives=0                ; 1 = 2004 PS2-demo dives (dive to slide) for all weapons, 0 = final dives (roll)
RifleDoorKick=0        ; 1 = cut door kick while holding a rifle (PS2 demo)
DigitalAmmo=0          ; 1 = ammo counter in the unused 7-segment font from the beta HUD (works right away)
DigitalAmmoScale=1.15   ; v0.88: size of the digital counters (1.15 = bigger + dark edge, 1.0 = same size + edge, 0 = game's own draw)
PauseControllerPicture=0  ; pause screen (Start) = controller picture: 0 off, 1 Xbox, 2 PS2 (needs the PS2 misc.vpp)
FlashbackWhispers=0      ; v0.51: 1 = restored whispered flashback lines during Slaughter mode
ComboHud=0             ; 2004 score display: 0 off, 1 misaligned (like the 2004 shots), 2 aligned (works right away)
ComboHudSplash=1       ; 1 = faint grey smoke behind the 2004 score display (like the weapon counter)
M16LauncherIcon=1        ; 1 = HUD shows the M16 with the M203 (2004 beta HUD; needs the HUD icons mini.vpp)
TargetHostageIcon=0      ; 1 = human-shield HUD icon is the 2004 target cutout (needs the HUD icons mini.vpp)
Lifebar2004=0            ; 1 = enemy health bar in the striped 2004 style, upright beside the enemy (needs the HUD icons mini.vpp)
LifebarSide=-0.45        ; 2004 bar: distance beside the enemy (positive = other side)
LifebarDrop=0.5          ; 2004 bar: how far below the retail (over-head) height its top sits

[Weapons]
; v0.35: bought weapon upgrades - 1 = attached (retail), 0 = left off. Applies when a weapon is given (next level / pickup)
AttachScope=1
AttachSilencer=1
AttachGrenadeLauncher=1
AttachExtendedMagazine=1
BlackColt=1             ; v0.89: the Punisher's own Colt .45 in the black No Mercy paint (enemies keep the normal one)

[Developer]
; v0.40: switches of the Xbox / PS2 developer console that the PC game still has the code for (all 0 = normal game)
BigHead=0                ; 1 = big heads (x2.5)
Invulnerable=0           ; 1 = the Punisher takes no damage
SlaughterCheat=0         ; 1 = Slaughter Mode meter always full
NoRespawn=0              ; 1 = enemy spawners stop
UnlimitedEnvActions=0    ; 1 = environment kills / interrogation spots reusable
OldReticle=0             ; 1 = older reticle behaviour
HudOff=0                 ; 1 = no HUD (screenshots)
HudMap=0                 ; 1 = the cut enemy radar, bottom left (experimental)
HudToggle=0              ; HUD on / off button: 0 off, hold LB + D-pad 1 Up, 2 Down, 3 Left, 4 Right
HudToggleKey=             ; HUD on / off keyboard key, any key name (F8, H, NUMPAD5 ...); empty = none
SongNames=0              ; 1 = "Current song: ..." message when the music changes
CrouchToggle=0           ; 1 = crouch button toggles (not hold)
ZoomToggle=0             ; 1 = zoom button toggles (not hold)
Slowmo=1.0               ; 1.0 = normal, up to 4.0 = slower

[Display]
BlackWhite=0             ; 0 = environment kills in colour (default), 1 = black & white (the game's look); wins over other mods (e.g. ermaccer's PunisherPlugin), 2 = let the game / other mods decide
BlackWhiteSlaughter=1    ; Slaughter mode: 1 = black & white, 0 = colour, 2 = let the game / other mods decide
ShadowDistance=12        ; v0.81: real shadows up to this many m from the camera (game 5; raise for a wide FOV / far camera)
Windowed=0               ; v0.51: 1 = run in a window (restart; not for the Steam Deck)
; v0.43: HUD size 0 = Auto (same share of the screen in handheld and on a TV), 1 = game size, 2 = 125 %, 3 = 150 %,
; 4 = 175 %, 5 = 200 %, 6 = 225 %, 7 = 250 %, 8 = 300 %
HudSize=0
; resolution for the next start (written to the Widescreen Fix ini): 0 = leave as is, 1 = auto (screen size), 2 = 1280x720,
; 3 = 1280x800, 4 = 1366x768, 5 = 1600x900, 6 = 1920x1080, 7 = 1920x1200, 8 = 2560x1440, 9 = 2560x1600, 10 = 3840x2160
Resolution=0

[Gore]
; v0.44: gore options (also on the Extended Menu page "Gore"; all work right away)
ExplodingHeads=2         ; quick kills with a head gib: 0 = Off (no gib: entry + exit head wounds per kill; Slaughter kills always gib), 1 = Random 50-50 (once per kill), 2 = Always (gore-patched exe)
WoundVariation=1         ; v0.45: 1 = the no-gib head wounds shift a little each kill, 0 = fixed spots
GunfireHeads=0           ; head gibs from normal shooting: 0 = Normal (the game; only some guns), 1 = Random 50-50, 2 = Off, 3 = Critical hits (any gun)
CritChance=25            ; v0.50.8: with GunfireHeads=3, chance in % (5-100) that a head-shot kill explodes the head
KillWounds=1             ; v0.46: 1 = knife / bash quick kills get 2+ blood marks at their own spots (entry + exit)
WorldBlood=1             ; v0.46: floor / wall blood pool: 0 = Normal (125), 1 = Large (300), 2 = Huge (600); bullet holes go first
BloodOnClothes=0         ; 1 = after a head gib: blood on the chest, a shoulder and the upper back
BulletHitBlood=0         ; blood mark at each bullet hit on a body: 0 = Normal, 1 = Bigger (x2.5), 2 = Heavy (x3 + a splat), 3 = Normal + splat (v0.45)
Stumps=1                 ; v0.77: gib stumps: 0 = Original (the game's flat cones), 1 = Restored (the developers' torn stumps with bone, turned out), 2 = Random variation (restored / bloodier / slim + cone legs / tucked arms). Needs the installer part "stumps"

[Photo]
MoveSpeed=1.2
TurnSpeed=1.0
InvertY=0
Key=F9                   ; v1.21: keyboard key for photo mode (no controller needed). W A S D move, E / Q up / down,
; v1.21 photo keys: mouse / arrows look, Shift fast, Ctrl slow, wheel / PgUp / PgDn zoom, F freeze, Enter save, Backspace leave

[Gameplay]
InterrogationKillScore=0   ; v0.66: killing during an interrogation: 0 unchanged (game / other mods), 1 penalty (original), 2 no penalty, 3 bonus

[Costume]
Outfit=0                 ; 0 = each level's own outfit, 1 = trench coat, 2 = T-shirt (next level / checkpoint load)
Costume=                 ; folder name in scripts\Extended Cut\Costumes (empty = the level files); changes at once in the menu
Skulls=1                 ; 1 = the in-game skulls follow the picked costume (if its folder has skulls), 0 = keep Apply's
MaxSize=4096             ; largest costume picture side the plugin accepts
NextKey=                 ; a keyboard key that steps to the next costume (e.g. F7), empty = none
